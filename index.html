<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5bd7">
  <meta name="description" content="CRICKET1 — Every Ball. Every Run. Every Moment.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <title>CRICKET1</title>
  <!-- Apply the saved theme before first paint (no flash, survives refresh). -->
  <script>try{var t=localStorage.getItem('cricket1-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;if(t==='dark')document.querySelector('meta[name=theme-color]').content='#0b1529'}catch(e){}</script>
  <script src="version.js"></script>
  <script>document.write('<link rel="stylesheet" href="src/styles/app.css?v='+(globalThis.CRICKET1_VERSION||'dev')+'">')</script>
  <noscript><link rel="stylesheet" href="src/styles/app.css"></noscript>
</head>
<body>
  <div id="app" class="app-shell">
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    <header id="topbar" class="topbar"></header>
    <main id="main-content" class="main-content" tabindex="-1"></main>
    <div id="update-banner" class="update-banner" role="status" hidden></div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation"></nav>
  </div>
  <div id="modal-root"></div>
  <script>
    /* Load the app module with the same version query as the stylesheet. */
    var s=document.createElement('script');s.type='module';s.src='src/app.js?v='+(globalThis.CRICKET1_VERSION||'dev');document.body.appendChild(s);
  </script>
</body>
</html>
